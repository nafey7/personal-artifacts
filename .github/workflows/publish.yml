name: Publish to npm

# Releases are cut by tagging: `npm version patch` in cli/, then push the tag.
# Publishing happens here over OIDC, so there is no npm token in this repo and
# no 2FA prompt to answer.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required — this is what proves the workflow's identity to npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use a recent npm
        run: npm install -g npm@latest

      # A tag that disagrees with package.json publishes a version nobody
      # expects, so stop before that rather than after.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match cli/package.json $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - name: Publish
        working-directory: cli
        run: npm publish --access public
